<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toddler Meal Idea Generator</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <div class="main-controls">
        <button id="generateBtn">✨ Generate</button>
        <button id="viewAllBtn">📋 View All Ingredients</button>
        <button id="viewSavedBtn">📂 My Meals</button>
    </div>

    <div id="meal-container">
        <h1>👶 Meal Idea Generator 🥕</h1>
        <div id="ingredient-list"></div>
        <div class="ingredient-actions">
            <button id="addBtn" style="display: none;">➕ Add ingredient</button>
            <button id="saveMealBtn">💾 Save Meal</button>
            <button id="searchRecipesBtn">🍳 Recipes</button>
        </div>
    </div>



    <script src="planner.js"></script>

    <!-- The Ingredients Modal -->
    <div id="ingredientsModal" class="modal">
      <div class="modal-content">
        <span class="close-btn">&times;</span>
        <h2>All Ingredients</h2>
        <details>
          <summary>Add Custom Ingredient</summary>
          <form id="add-ingredient-form">
            <input type="text" id="new-ingredient-name" placeholder="Ingredient Name" required>
            <div id="new-ingredient-groups"></div>
            <button type="submit">✔️ Add Ingredient</button>
          </form>
        </details>
        <hr>
        <button id="resetIngredientsBtn">🔄 Reset to Default</button>
        <div id="modal-ingredient-list"></div>
      </div>
    </div>

    <!-- The Saved Meals Modal -->
    <div id="savedMealsModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>My Meals</h2>
            <ul id="saved-meals-list"></ul>
        </div>
    </div>

    <footer>
      <a href="https://github.com/mick88/meal-planner" target="_blank" rel="noopener noreferrer">
        <span class="github-icon"></span>
        View on GitHub
      </a>
      <p class="disclaimer">Nutritional information is for demonstration purposes only and has not been verified.</p>
    </footer>

</body>
</html>
