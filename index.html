<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toddler Meal Idea Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="meal-container">
        <h1>Meal Idea Generator 🥕</h1>
        <div id="result">
            <div id="ingredient-list">
                <p>Click the button to get a meal idea!</p>
            </div>
            <button id="addBtn" style="display: none;">Add another ➕</button>
        </div>
    </div>

    <button id="generateBtn">Generate ✨</button>
    <button id="viewAllBtn">View All Ingredients</button>

    <script src="planner.js"></script>

    <!-- The Modal -->
    <div id="ingredientsModal" class="modal">
      <div class="modal-content">
        <span class="close-btn">&times;</span>
        <h2>All Ingredients</h2>
        <form id="add-ingredient-form">
          <input type="text" id="new-ingredient-name" placeholder="Ingredient Name" required>
          <div id="new-ingredient-groups"></div>
          <button type="submit">Add Ingredient</button>
        </form>
        <hr>
        <button id="resetIngredientsBtn">Reset to Default</button>
        <div id="modal-ingredient-list"></div>
      </div>
    </div>

</body>
</html>
